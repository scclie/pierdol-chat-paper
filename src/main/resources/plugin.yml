name: PierdolChat
version: '${version}'
main: dev.sccl.pierdolchat.PierdolChatPlugin
api-version: '26.3'
softdepend: [AddHeads, DiscordSRV]
description: In-memory global and nearby local player chat.
commands:
  local:
    description: Switch to local chat within the configured radius.
    usage: /local
  global:
    description: Switch to server-wide global chat.
    usage: /global
